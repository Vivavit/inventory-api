services:
  - type: web
    name: inventory-api
    runtime: php
    plan: standard
    buildCommand: >
      npm install &&
      npm build &&
      composer install --no-dev --optimize-autoloader &&
      php artisan migrate --force &&
      php artisan storage:link --force &&
      php artisan config:clear &&
      php artisan cache:clear
    startCommand: >
      php -d variables_order=EGPCS -S 0.0.0.0:${PORT:-8080}
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: stderr
    disk:
      name: storage
      mountPath: /var/data
      sizeGB: 10
